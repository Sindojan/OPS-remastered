# Produktion-Override: TLS/HTTPS Support
# Verwendung: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Voraussetzungen:
# - TLS-Zertifikate unter ./docker/nginx/ssl/ (fullchain.pem + privkey.pem)
# - CORS_ALLOWED_ORIGINS und API_URL auf https://... setzen

services:

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-https://localhost}

  nginx:
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
