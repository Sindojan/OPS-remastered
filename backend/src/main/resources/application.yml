spring:
  application:
    name: owlsburg-ops

  profiles:
    active: dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  flyway:
    enabled: false  # Managed programmatically via FlywayConfig

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:owlsburg-documents}

jwt:
  secret: ${JWT_SECRET:change-me-in-production}
  expiration: 86400000        # 24 hours
  refresh-expiration: 604800000  # 7 days

encryption:
  key: ${ENCRYPTION_KEY:default-dev-key-change-in-prod-32ch}

cors:
  allowed-origins: http://localhost:3000,http://localhost:4201

system-admin:
  email: ${SYSTEM_ADMIN_EMAIL:#{null}}
  password: ${SYSTEM_ADMIN_PASSWORD:#{null}}

system-llm:
  api-key: ${SYSTEM_LLM_API_KEY:#{null}}

server:
  port: 8080
