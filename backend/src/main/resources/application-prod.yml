spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/owlsburg_ops}
    username: ${DB_USER:owlsburg_app}
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        show_sql: false
    hibernate:
      ddl-auto: none

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost}

logging:
  level:
    root: WARN
    com.owlsburg.ops: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
