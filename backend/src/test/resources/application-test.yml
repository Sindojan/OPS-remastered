spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///owlsburg_ops_test
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        default_schema: public
  flyway:
    enabled: false

jwt:
  secret: test-secret-key-for-unit-tests-min-32-chars!!
  expiration: 86400000
  refresh-expiration: 604800000

encryption:
  key: test-encryption-key-32-characters!

cors:
  allowed-origins: http://localhost:3000

minio:
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: test-documents

logging:
  level:
    root: WARN
    com.owlsburg.ops: INFO
