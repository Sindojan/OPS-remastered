# Development Override
# Verwendung: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Oder einfach: ./scripts/dev.sh

services:

  postgres:
    environment:
      POSTGRES_DB: owlsburg_ops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  minio:
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9002:9001"

  # Backend läuft nativ im Dev-Modus
  backend:
    profiles: ["prod-only"]

  # Frontend läuft nativ im Dev-Modus
  frontend:
    profiles: ["prod-only"]

  # Kein Nginx im Dev-Modus
  nginx:
    profiles: ["prod-only"]
